name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://flexbox:flexbox@localhost:5432/flexbox_linktree_ci?schema=public
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-only-nextauth-secret-at-least-32-characters
  AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
  RATE_LIMIT_SECRET: ci-only-rate-limit-secret-at-least-32-characters
  MEDIA_STORAGE_DRIVER: local
  MEDIA_LOCAL_ROOT: .local-storage/uploads

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flexbox
          POSTGRES_PASSWORD: flexbox
          POSTGRES_DB: flexbox_linktree_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flexbox -d flexbox_linktree_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  supply-chain:
    name: Supply chain checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Scan tracked files for likely secrets
        run: node scripts/secret-scan.mjs
