# pnpm 12 blocks dependency build scripts by default.
# Only allowlisted packages may run install scripts. Review a package's
# postinstall script before adding it here.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

# Force patched transitive versions where a parent package still pins a
# vulnerable range. Dev-only lint tooling pulls minimatch <11.0.1
# (GHSA-g3hv-75wg-m249); 11.0.1 keeps the same API for our usage.
overrides:
  "minimatch@<11.0.1": 11.0.1